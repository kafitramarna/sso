server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA fallback — React Router owns all non-file paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
